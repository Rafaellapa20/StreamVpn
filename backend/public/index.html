<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamVPN — Administração</title>
<style>
  :root{
    --bg:#0A0F1A; --panel:#131B2A; --line:#1E2A3D; --text:#E6EDF5; --muted:#8A9BB0;
    --accent:#00E5FF; --ok:#00E676; --warn:#FFC107; --bad:#FF5252; --focus:#00E5FF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:6px}
  button:hover{border-color:var(--accent)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  button.primary{background:var(--accent);color:#04121A;border-color:var(--accent);font-weight:600}
  button.danger{color:var(--bad);border-color:#4A2020}
  button.ghost{border-color:transparent;padding:4px 8px;color:var(--muted)}
  button.ghost:hover{color:var(--text)}
  input,select{background:#0D1421;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
  input::placeholder,textarea::placeholder{color:#55677D}
  textarea{background:#0D1421;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-height:220px;font:12px/1.45 ui-monospace,Consolas,monospace;color:var(--text);resize:vertical}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .switch input{width:auto}
  h1{font-size:18px;font-weight:600;margin:0}
  h2{font-size:22px;font-weight:600;margin:0 0 4px}
  .muted{color:var(--muted)}
  .hidden{display:none!important}

  /* login */
  #login{min-height:100%;display:grid;place-items:center;padding:24px}
  #login form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px}
  #login .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  #login label{display:block;margin:14px 0 6px;color:var(--muted)}
  #login button{width:100%;margin-top:22px;padding:10px}
  .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);
    display:grid;place-items:center;color:#04121A;font-weight:800}

  /* shell */
  #app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
  nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
  nav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
  nav a.item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;
    color:var(--muted);text-decoration:none}
  nav a.item:hover{color:var(--text);background:#182335}
  nav a.item.active{color:var(--text);background:#182335;box-shadow:inset 3px 0 0 var(--accent)}
  nav .spacer{flex:1}
  nav .who{padding:10px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
  main{padding:28px 36px;max-width:1200px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .stat b{display:block;font-size:26px;font-weight:600;line-height:1.1}
  .stat span{color:var(--muted);font-size:13px}

  /* table */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:500;font-size:13px}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#172133}
  td.actions{text-align:right;white-space:nowrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .dot.active{background:var(--ok);box-shadow:0 0 0 3px rgba(0,230,118,.15)}
  .dot.inactive{background:#55677D}
  .dot.error{background:var(--bad)}
  .tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#1B2638;color:var(--muted)}
  .tag.admin{color:var(--accent)}
  .bar{height:6px;background:#1B2638;border-radius:3px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle;margin-right:8px}
  .bar i{display:block;height:100%;background:var(--ok)}
  .bar.warning i{background:var(--warn)} .bar.exceeded i{background:var(--bad)}
  .empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px}

  /* drawer */
  #drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);
    padding:28px;transform:translateX(100%);transition:transform .2s;z-index:20;overflow:auto}
  #drawer.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
  #drawer label{display:block;margin:14px 0 6px;color:var(--muted)}
  #drawer .row{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}
  @media (prefers-reduced-motion:reduce){#drawer{transition:none}}

  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#182335;border:1px solid var(--line);
    padding:10px 16px;border-radius:8px;z-index:30}
  #toast.bad{border-color:var(--bad)}

  @media (max-width:760px){
    #app{grid-template-columns:1fr} nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
    nav .brand,nav .who,nav .spacer{display:none} main{padding:20px 16px}
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:#1B2638;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;gap:8px;align-items:center}
  .chip b{cursor:pointer;color:var(--muted)} .chip b:hover{color:var(--bad)}
  .note{font-size:12px;color:var(--muted);margin-top:4px}
  .box{background:#0D1421;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:14px}
  .box.info{border-color:#1F4B5A;background:#0E1E26;color:#9BE3F2}
  .sub{margin:6px 0 0 22px;padding:8px 0 8px 12px;border-left:2px solid var(--line)}
  .sub .wg{display:flex;align-items:center;gap:10px;padding:5px 0}
  .sub .wg .ep{flex:1;color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .exp{font-size:12px} .exp.soon{color:var(--warn)} .exp.over{color:var(--bad)}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  /* --- dispositivos / controlo remoto --- */
  .devhead{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
  .devhead .sp{flex:1}
  .screen{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
  .screen .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .screen .bar .lights i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  .screen .view{position:relative;background:#000;aspect-ratio:16/9;display:grid;place-items:center}
  .screen .view img{width:100%;height:100%;object-fit:contain}
  .screen .view .placeholder{color:var(--muted)}
  .screen .live{position:absolute;top:12px;right:12px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
  .screen .foot{display:flex;justify-content:space-between;padding:8px 14px;font-size:12px;color:var(--muted)}
  button.rec{background:#3a1216;border-color:#5a1a20;color:#fff} button.rec.on{background:var(--bad);border-color:var(--bad)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .quick{display:flex;gap:8px;flex-wrap:wrap}
  .quick button{border-width:1px}
  .quick .b-red{color:#FF7B7B;border-color:#5a2a2a} .quick .b-yel{color:#FFD166;border-color:#5a4a1a} .quick .b-cyan{color:var(--accent);border-color:#1F4B5A} .quick .b-green{color:var(--ok);border-color:#1e4a2e}
  .cmdlog{font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);max-height:180px;overflow:auto}
  .cmdlog span{color:#55677D;margin-right:8px}
  .remote{width:220px;margin:8px auto 0;background:linear-gradient(180deg,#152136,#0F1829);border:1px solid var(--line);border-radius:28px;padding:24px 18px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .remote .brand{font-size:9px;letter-spacing:.3em;color:var(--muted);margin-bottom:18px}
  .remote .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center}
  .remote .pad button{border-radius:14px;font-size:18px;padding:0}
  .remote .pad .ok{background:#1F4B5A;border-color:var(--accent);color:#fff;font-weight:600;font-size:13px}
  .remote .back{margin-top:14px;width:100%;border-radius:12px}
  .remote button:active{transform:translateY(1px)}
  .devrow td .sub2{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<section id="login">
  <form onsubmit="return doLogin(event)">
    <div class="brand"><span class="logo">S</span><h1>StreamVPN</h1></div>
    <p class="muted" style="margin:0">Entra com a tua conta de administrador ou revendedor.</p>
    <label for="lUser">Utilizador</label>
    <input id="lUser" autocomplete="username" value="admin" required>
    <label for="lPass">Password</label>
    <input id="lPass" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Entrar</button>
    <p id="lErr" class="muted" style="margin:14px 0 0;color:var(--bad)"></p>
  </form>
</section>

<section id="app" class="hidden">
  <nav>
    <div class="brand"><span class="logo">S</span><h1>StreamVPN</h1></div>
    <a class="item" href="#dashboard" data-view="dashboard">Visão geral</a>
    <a class="item" href="#users" data-view="users">Utilizadores <span id="nUsers" class="tag"></span></a>
    <a class="item" href="#servers" data-view="servers">Servidores VPN <span id="nServers" class="tag"></span></a>
    <a class="item" href="#devices" data-view="devices">Dispositivos <span id="nOnline" class="tag"></span></a>
    <a class="item" href="#dns" data-view="dns">DNS</a>
    <a class="item" href="#logs" data-view="logs">Ligações</a>
    <div class="spacer"></div>
    <div class="who"><span id="whoUser"></span><span id="whoCredits"></span><br><button class="ghost" onclick="logout()" style="padding-left:0">Sair</button></div>
  </nav>
  <main id="view"></main>
</section>

<div id="scrim" class="hidden" onclick="closeDrawer()"></div>
<aside id="drawer" aria-hidden="true"></aside>
<div id="toast" class="hidden" role="status"></div>

<script>
const API = location.origin + '/api';
const $ = s => document.querySelector(s);
let token = localStorage.getItem('svpn_token');
let me = JSON.parse(localStorage.getItem('svpn_me') || 'null');
let cache = { servers: [], users: [], dns: [], packs: { 1: 1, 3: 3, 6: 6, 12: 12 }, credits: null };

// ---------- HTTP ----------
async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (r.status === 401) { logout(); throw new Error('Sessão expirada'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('Erro ' + r.status));
  return data;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : '';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 3000);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function countryToFlag(code) {
  if (!code || code.length !== 2) return '';
  return code.toUpperCase().split('').map(c => String.fromCodePoint(0x1F1E6 - 65 + c.charCodeAt(0))).join('');
}
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-PT') : '—';
const fmtDateTime = d => d ? new Date(d).toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const fmtBytes = b => !b ? '0' : b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(0) + ' MB' : (b / 1e3).toFixed(0) + ' KB';
const val = id => $('#' + id).value.trim();
function expiryHtml(d) {
  if (!d) return '<span class="muted">—</span>';
  const days = Math.ceil((new Date(d) - Date.now()) / 864e5);
  if (days < 0) return `<span class="exp over">Expirou ${fmtDate(d)}</span>`;
  if (days <= 7) return `<span class="exp soon">${fmtDate(d)} · ${days} dia${days === 1 ? '' : 's'}</span>`;
  return `<span class="exp">${fmtDate(d)} · ${days} dias</span>`;
}
function creditsHtml() { return cache.credits === null ? '' : ` · <b>${cache.credits}</b> crédito${cache.credits === 1 ? '' : 's'}`; }

// ---------- Auth ----------
async function doLogin(e) {
  e.preventDefault(); $('#lErr').textContent = '';
  try {
    const d = await api('/auth/login', { method: 'POST', body: { username: $('#lUser').value, password: $('#lPass').value } });
    if (!['admin', 'reseller'].includes(d.user.role)) throw new Error('Esta conta não tem acesso ao painel');
    token = d.token; me = d.user;
    localStorage.setItem('svpn_token', token); localStorage.setItem('svpn_me', JSON.stringify(me));
    boot();
  } catch (err) { $('#lErr').textContent = err.message; }
  return false;
}
function logout() {
  token = null; me = null; localStorage.removeItem('svpn_token'); localStorage.removeItem('svpn_me');
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
}
function boot() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#whoUser').textContent = me.username;
  ensurePanelWs();
  route();
}

// ---------- Router ----------
const views = { dashboard, users, servers, dns, logs, devices, remote };
function route() {
  const [v, arg] = (location.hash || '#dashboard').slice(1).split('/');
  document.querySelectorAll('nav a.item').forEach(a => a.classList.toggle('active', a.dataset.view === v || (v === 'remote' && a.dataset.view === 'devices')));
  if (v !== 'remote') leaveRemote();
  (views[v] || dashboard)(arg);
}
window.addEventListener('hashchange', () => token && route());

async function loadStats() {
  const s = await api('/admin/stats');
  cache.packs = s.packs; cache.credits = s.credits;
  $('#nServers').textContent = s.servers; $('#nUsers').textContent = s.users;
  $('#whoCredits').innerHTML = creditsHtml();
  return s;
}

// ---------- Visão geral ----------
async function dashboard() {
  $('#view').innerHTML = `<div class="head"><div><h2>Visão geral</h2><p class="muted" style="margin:0">Estado do serviço neste momento.</p></div></div><div class="stats" id="stats"></div>`;
  try {
    const s = await loadStats();
    const cards = [
      [s.activeUsers, 'utilizadores ativos'], [s.expired, 'expirados'],
      [s.servers, 'servidores VPN ativos'], [s.wireguards, 'WireGuards ativos'], [s.activeConnections, 'ligações ativas']
    ];
    if (s.credits !== null) cards.unshift([s.credits, 'créditos disponíveis']);
    $('#stats').innerHTML = cards.map(([b, l]) => `<div class="stat"><b>${b}</b><span>${l}</span></div>`).join('');
  } catch (e) { toast(e.message, true); }
}

// ---------- Utilizadores ----------
async function users() {
  $('#view').innerHTML = `<div class="head"><div><h2>Utilizadores</h2><p class="muted" style="margin:0">Cada cliente recebe um código de ativação para meter uma vez na app.</p></div>
    <button class="primary" onclick="userForm()">Adicionar utilizador</button></div><div id="tbl"></div>`;
  try {
    [cache.users, cache.servers, cache.dns] = await Promise.all([api('/admin/users'), api('/admin/servers'), api('/admin/dns'), loadStats()]);
    if (!cache.users.length) { $('#tbl').innerHTML = `<div class="empty">Ainda não há utilizadores. Cria o primeiro com o mesmo login da app IPTV.</div>`; return; }
    $('#tbl').innerHTML = `<table><thead><tr><th>Utilizador</th><th>Código de ativação</th><th>Servidor VPN</th><th>DNS</th><th>Validade</th><th></th></tr></thead><tbody>` +
      cache.users.map(u => `<tr>
        <td><span class="dot ${u.active === false || u.expired ? 'inactive' : 'active'}"></span>${esc(u.username)}${u.requireClientApp ? '<div class="note">App obrigatória</div>' : ''}</td>
        <td>${u.activationCode ? `<code style="font-size:13px;letter-spacing:.05em">${esc(u.activationCode)}</code> <button class="ghost" title="Copiar" onclick="navigator.clipboard.writeText('${esc(u.activationCode)}').then(()=>toast('Código copiado'))">⧉</button>` : '<span class="muted">—</span>'}</td>
        <td>${u.vpnServers?.[0] ? esc(u.vpnServers[0].name) : '<span class="muted">—</span>'}</td>
        <td class="muted">${(u.dns || []).map(esc).join('<br>') || '—'}</td>
        <td>${expiryHtml(u.expiresAt)}</td>
        <td class="actions">
          <button class="ghost" onclick="location.hash='#devices/${encodeURIComponent(u.username)}'">Dispositivos</button>
          <button class="ghost" onclick="renewForm('${u._id}')">Renovar</button>
          <button class="ghost" onclick="newCode('${u._id}')">Novo código</button>
          <button class="ghost" onclick="toggleUser('${u._id}')">${u.active === false ? 'Ativar' : 'Desativar'}</button>
          <button class="ghost" onclick="userForm('${u._id}')">Editar</button>
          <button class="ghost danger" onclick="delUser('${u._id}')">Apagar</button>
        </td></tr>`).join('') + `</tbody></table>`;
  } catch (e) { toast(e.message, true); }
}

function packOptions(sel) {
  return Object.entries(cache.packs).map(([m, c]) =>
    `<option value="${m}" ${String(sel) === m ? 'selected' : ''}>${m} ${m === '1' ? 'mês' : 'meses'} (${c} crédito${c === 1 ? '' : 's'})</option>`).join('');
}
let formDns = [], formSrv = [];
function renderSrvChips() {
  $('#srvChips').innerHTML = formSrv.length
    ? formSrv.map((id, i) => { const s = cache.servers.find(x => x._id === id); return `<span class="chip">${i + 1}. ${esc(s?.name || id)} <b onclick="formSrv.splice(${i},1);renderSrvChips()" title="Remover">✕</b></span>`; }).join('')
    : '<span class="note">Nenhum servidor — obrigatório pelo menos um</span>';
}
function addSrv() {
  const v = $('#fSrvSel').value; if (!v || formSrv.includes(v)) return;
  formSrv.push(v); renderSrvChips(); $('#fSrvSel').value = '';
}
function renderDnsChips() {
  $('#dnsChips').innerHTML = formDns.length
    ? formDns.map((d, i) => `<span class="chip">${i + 1}. ${esc(d)} <b onclick="formDns.splice(${i},1);renderDnsChips()" title="Remover">✕</b></span>`).join('')
    : '<span class="note">Nenhum DNS associado</span>';
}
function addDns() {
  const v = $('#fDnsSel').value; if (!v || formDns.includes(v)) return;
  formDns.push(v); renderDnsChips(); $('#fDnsSel').value = '';
}

function userForm(id) {
  const u = cache.users.find(x => x._id === id) || {};
  formDns = [...(u.dns || [])];
  formSrv = (u.vpnServers || []).map(s => s._id || s);
  const servers = cache.servers.filter(s => s.status === 'active');
  const srvOpts = `<option value="">Selecionar servidor...</option>` + servers.map(s =>
    `<option value="${s._id}" ${formSrv[0] === s._id ? 'selected' : ''} ${!s.wireguards.some(w => w.active) ? 'disabled' : ''}>${esc(s.name)} (${s.wireguards.filter(w => w.active).length} WG)</option>`).join('');
  const dnsOpts = `<option value="">Escolher DNS...</option>` + cache.dns.filter(d => d.active).map(d => `<option value="${esc(d.domain)}">${esc(d.domain)}${d.label ? ' — ' + esc(d.label) : ''}</option>`).join('');
  const balance = cache.credits === null ? 'Sem limite de créditos (administrador)' : `Saldo atual: <b>${cache.credits}</b> crédito${cache.credits === 1 ? '' : 's'}`;

  openDrawer(`<h2>${id ? 'Editar utilizador' : 'Novo utilizador'}</h2>
    <div class="grid2">
      <div><label for="fUser">Utilizador *</label><input id="fUser" value="${esc(u.username || '')}" autocomplete="off" ${id ? 'disabled' : ''}></div>
      <div><label for="fPass">${id ? 'Nova password' : 'Password *'}</label><input id="fPass" type="password" autocomplete="new-password" placeholder="${id ? 'vazio = manter' : ''}"></div>
    </div>
    <label for="fNotes">Notas (opcional)</label>
    <textarea id="fNotes" style="min-height:70px;font:inherit">${esc(u.notes || '')}</textarea>
    <div class="box">
      <label class="switch" style="margin:0"><input type="checkbox" id="fApp" ${u.requireClientApp ? 'checked' : ''}> App Cliente obrigatória — verificar e instalar</label>
      <div class="note">Se não marcar, entra direto sem verificação.</div>
    </div>

// ---------- WebSocket do painel ----------
let pws = null, pwsTimer = null;
const devState = { list: [], watching: null, auto: false, frames: 0 };
function wsUrl() { return location.origin.replace(/^http/, 'ws') + '/ws/panel?token=' + token; }
function ensurePanelWs() {
  if (pws && (pws.readyState === 0 || pws.readyState === 1)) return;
  pws = new WebSocket(wsUrl());
  pws.onopen = () => { clearTimeout(pwsTimer); if (devState.watching) pws.send(JSON.stringify({ type: 'watch', deviceId: devState.watching })); };
  pws.onclose = () => { pwsTimer = setTimeout(ensurePanelWs, 3000); };
  pws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'devices') { devState.list = m.list; onDevicesChanged(); }
    else if (m.type === 'device') { const i = devState.list.findIndex(d => d.deviceId === m.device.deviceId); if (i >= 0) devState.list[i] = m.device; else devState.list.unshift(m.device); onDevicesChanged(); }
    else if (m.type === 'frame' && m.deviceId === devState.watching) { onFrame(m.jpeg); }
    else if (m.type === 'result' && m.deviceId === devState.watching) { cmdLog(`${m.ok ? '✓' : '✗'} ${m.command}${m.detail ? ': ' + m.detail : ''}`); }
    else if (m.type === 'log' && m.deviceId === devState.watching) { cmdLog(m.text); }
  };
}
function wsSend(obj) { if (pws?.readyState === 1) pws.send(JSON.stringify(obj)); else toast('Sem ligação em tempo real — a religar…', true); }
function onDevicesChanged() {
  $('#nOnline').textContent = devState.list.filter(d => d.online).length || '';
  if (location.hash.startsWith('#devices')) renderDevices();
  if (devState.watching) renderDevHead();
}
const devName = d => d.username || '—';
const devLabel = d => [d.brand, d.model].filter(Boolean).join(' ') || 'Dispositivo';
function vpnModeLabel(d) {
  if (!d.vpnOn) return '<span class="muted">VPN OFF</span>';
  if (d.vpnMode === 'byedpi') return '<span style="color:var(--ok)">🛡 Proteção local</span>';
  if (d.vpnMode === 'wireguard') {
    const flag = d.vpnCountry ? countryToFlag(d.vpnCountry) : '';
    const srv = d.vpnServer ? esc(d.vpnServer) : '';
    return `<span style="color:var(--accent)">🔒 VPN · ${srv}${flag ? ' ' + flag : ''}</span>`;
  }
  return `<span style="color:var(--accent)">VPN ON${d.vpnServer ? ' · ' + esc(d.vpnServer) : ''}</span>`;
}

      <button class="b-cyan" onclick="editUserFromDevice('${esc(d.username || '')}')">✎ Editar utilizador</button>
      <button class="b-cyan" onclick="historyDrawer('${deviceId}')">⟲ Histórico</button>
      <button class="b-green" onclick="cmd('RELOAD')">⌂ Menu principal</button></div></div>
    <div class="card"><h3>› Log de comandos</h3><div class="cmdlog" id="cmdLog"></div></div>
    <div class="remote"><div class="brand">STREAMVPN REMOTE</div>
      <div class="pad"><span></span><button onclick="key('UP')">▲</button><span></span>
        <button onclick="key('LEFT')">◀</button><button class="ok" onclick="key('OK')">OK</button><button onclick="key('RIGHT')">▶</button>
        <span></span><button onclick="key('DOWN')">▼</button><span></span></div>
      <button class="back" onclick="key('BACK')">← Voltar</button></div>`;
  renderDevHead();
  cmdLog(`Controlo remoto iniciado para ${devName(d)}`);
  if (d.lastScreenshotAt) { try { const full = await api(`/admin/devices/${deviceId}`); if (full.lastScreenshot) onFrame(full.lastScreenshot, true); } catch {} }
  document.onkeydown = remoteKeys;
}
function leaveRemote() {
  if (devState.watching) { if (pws?.readyState === 1) pws.send(JSON.stringify({ type: 'unwatch', deviceId: devState.watching })); devState.watching = null; }
  clearInterval(devState.autoTimer); devState.auto = false; document.onkeydown = null;
}
function renderDevHead() {
  const d = devState.list.find(x => x.deviceId === devState.watching); const el = $('#devHead'); if (!d || !el) return;
  el.innerHTML = `<span class="dot ${d.online ? 'active' : 'inactive'}"></span><b>${esc(devName(d))}</b>
    <span class="muted" style="font-size:12px">${esc(d.mac || devLabel(d))}</span>
    <span class="tag" style="background:#1F4B5A;color:#fff">${esc(d.screen || (d.online ? 'App aberta' : 'Offline'))}</span>
    ${d.playing ? `<span class="muted" style="font-size:12px">▶ ${esc(d.playing)}</span>` : ''}
    <span class="tag">${vpnModeLabel(d)}</span>
    <span class="sp"></span><span class="muted" style="font-size:12px">🕒 ${d.online ? 'online' : 'visto ' + fmtDateTime(d.lastSeen)}</span>`;
}
function cmdLog(text) {
  const el = $('#cmdLog'); if (!el) return;
  const t = new Date().toLocaleTimeString('pt-PT');
  el.insertAdjacentHTML('afterbegin', `<div><span>[${t}]</span>${esc(text)}</div>`);
}
function onFrame(jpeg, stored) {
  const img = $('#frameImg'); if (!img) return;
  img.src = 'data:image/jpeg;base64,' + jpeg; img.classList.remove('hidden'); $('#framePh')?.classList.add('hidden');
  if (!stored) { devState.frames++; $('#frameInfo').textContent = `Frame ${devState.frames}`; }
  $('#frameFoot').textContent = (stored ? '📷 Última captura guardada' : (devState.liveOn ? '🔴 AO VIVO — frame #' + devState.frames : '📷 Captura')) + ' · ' + new Date().toLocaleTimeString('pt-PT');
}
function cmd(command, payload) {
  const d = devState.list.find(x => x.deviceId === devState.watching);
  if (!d?.online) return toast('Dispositivo offline', true);
  wsSend({ type: 'command', deviceId: devState.watching, command, payload });
}
function confirmCmd(command, text) { if (confirm(text)) cmd(command); }
function key(k) { cmd('KEY', { key: k }); }
function remoteKeys(e) {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
  const map = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', Enter: 'OK', Backspace: 'BACK', Escape: 'BACK' };
  if (map[e.key]) { e.preventDefault(); key(map[e.key]); }
}
function toggleLive() {
  devState.liveOn = !devState.liveOn;
  $('#liveBtn').classList.toggle('on', devState.liveOn); $('#liveBtn').textContent = devState.liveOn ? '● LIVE ON' : '● LIVE';
  $('#liveTag').classList.toggle('hidden', !devState.liveOn);
  wsSend({ type: devState.liveOn ? 'watch' : 'unwatch', deviceId: devState.watching });
  cmdLog(devState.liveOn ? 'A iniciar transmissão ao vivo…' : 'Transmissão ao vivo parada');
}
function toggleAuto() {
  devState.auto = !devState.auto; $('#autoBtn').classList.toggle('primary', devState.auto);
  clearInterval(devState.autoTimer);
  if (devState.auto) { cmd('SCREENSHOT'); devState.autoTimer = setInterval(() => cmd('SCREENSHOT'), 5000); }
}
function messageForm() {
  openDrawer(`<h2>Enviar mensagem</h2><p class="muted" style="margin:4px 0 0">Aparece num diálogo no ecrã do cliente.</p>
    <label for="fMsgTitle">Título</label><input id="fMsgTitle" value="Mensagem do suporte">
    <label for="fMsg">Mensagem</label><textarea id="fMsg" style="min-height:110px;font:inherit" placeholder="Ex.: A sua subscrição termina em 3 dias."></textarea>
    <div class="row"><button onclick="closeDrawer()">Cancelar</button><button class="primary" onclick="sendMessage()">Enviar</button></div>`);
}
function sendMessage() {
  const text = val('fMsg'); if (!text) return toast('Escreve a mensagem', true);
  cmd('MESSAGE', { title: val('fMsgTitle'), text }); closeDrawer(); cmdLog(`Mensagem enviada: "${text.slice(0, 60)}"`);
}
async function editUserFromDevice(username) {
  try { cache.servers = await api('/admin/servers'); cache.dns = await api('/admin/dns'); cache.users = await api('/admin/users'); await loadStats(); } catch (e) { return toast(e.message, true); }
  const u = cache.users.find(x => x.username === username); if (!u) return toast('Utilizador não encontrado', true);
  userForm(u._id);
}
async function historyDrawer(deviceId) {
  try {
    const ev = await api(`/admin/devices/${deviceId}/events?limit=200`);
    const label = { command: 'Comando', result: 'Resultado', online: 'Online', offline: 'Offline', message: 'Mensagem', error: 'Erro' };
    openDrawer(`<h2>Histórico</h2><div class="cmdlog" style="max-height:70vh;margin-top:12px">` +
      (ev.length ? ev.map(e => `<div><span>[${fmtDateTime(e.createdAt)}]</span>${label[e.type] || e.type}${e.command ? ' ' + esc(e.command) : ''}${e.by ? ' por ' + esc(e.by) : ''}${e.ok === false ? ' ✗' : ''}${e.detail ? ' — ' + esc(e.detail) : ''}${e.payload?.text ? ' — "' + esc(e.payload.text) + '"' : ''}</div>`).join('') : '<div class="muted">Sem eventos ainda.</div>') +
      `</div><div class="row"><button class="primary" onclick="closeDrawer()">Fechar</button></div>`);
  } catch (e) { toast(e.message, true); }
}

// ---------- Drawer ----------
function openDrawer(html) { $('#drawer').innerHTML = html; $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.remove('hidden'); $('#drawer input:not([disabled]),#drawer textarea,#drawer select')?.focus(); }
function closeDrawer() { $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.add('hidden'); }

// ---------- Init ----------
if (token && me && ['admin', 'reseller'].includes(me.role)) boot();
</script>
</body>
</html>
