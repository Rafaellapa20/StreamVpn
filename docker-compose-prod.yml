version: '3.8'

services:
  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: streamvpn

  backend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/streamvpn
      JWT_SECRET: seu_segredo_super_secreto
      PORT: 3000
    volumes:
      - ./backend:/app/backend

volumes:
  mongo-data:
