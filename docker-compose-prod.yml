version: '3.8'

services:
  mongo:
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: streamvpn
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/streamvpn
      PORT: 3000
    volumes:
      - ./backend:/app/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  mongo-data:
